[project]
name = "gepa-optimize-anything-codex"
version = "1.1.0"
description = "Codex adapter for GEPA Optimize Anything"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shawn Patterson" }]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.11",
]
live = [
  "gepa[full] @ git+https://github.com/sh-patterson/gepa.git@3a6f93c5dd0beb68825973b3b2f2cae23060bbbb",
]
[tool.pytest.ini_options]
markers = [
  "live: makes a live model call",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
