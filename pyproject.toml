[project]
name = "gepa-optimize-anything-codex"
version = "0.1.0"
description = "Codex adapter for GEPA Optimize Anything"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shawn Patterson" }]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.11",
]

[tool.pytest.ini_options]
markers = [
  "live: makes a paid Codex API call",
]

[tool.ruff]
line-length = 88
target-version = "py311"
