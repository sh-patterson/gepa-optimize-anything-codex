[project]
name = "gepa-optimize-anything-codex"
version = "0.1.0"
description = "Codex adapter for GEPA Optimize Anything"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shawn Patterson" }]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.11",
]
live = [
  "gepa @ git+https://github.com/gepa-ai/gepa.git@f919db0a622e2e9f9204779b81fe00cc1b2d808f",
]
[tool.pytest.ini_options]
markers = [
  "live: makes a paid Codex API call",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
