[project]
name = "gepa-optimize-anything-codex"
version = "0.3.0"
description = "Codex adapter for GEPA Optimize Anything"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shawn Patterson" }]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.11",
]
live = [
  "gepa[full] @ git+https://github.com/sh-patterson/gepa.git@41ca7c3a3d1cc502ab357163325b9751a05507f6",
]
[tool.pytest.ini_options]
markers = [
  "live: makes a paid Codex API call",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
