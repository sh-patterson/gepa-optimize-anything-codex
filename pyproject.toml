[project]
name = "gepa-optimize-anything-codex"
version = "0.3.2"
description = "Codex adapter for GEPA Optimize Anything"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Shawn Patterson" }]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.11",
]
live = [
  "gepa[full] @ git+https://github.com/gepa-ai/gepa.git@0310bb7b4952d4695718f9f557e450fd6781301e",
]
[tool.pytest.ini_options]
markers = [
  "live: makes a live model call",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
